<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let startTime;
        let timerInterval;
        let elapsedTime = 0;
        let running = false;

        function startTimer() {
            if (!running) {
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(updateTimer, 1000);
                running = true;
            }
        }

        function updateTimer() {
            elapsedTime = Date.now() - startTime;
            document.getElementById("timerDisplay").innerText = Math.floor(elapsedTime / 1000) + " 秒";
        }

        function stopTimer() {
            clearInterval(timerInterval);
            running = false;
        }

        function resetTimer() {
            stopTimer();
            elapsedTime = 0;
            document.getElementById("timerDisplay").innerText = "0 秒";
        }
    </script>
</head>
<body>
    <div id="timerDisplay">0 秒</div>
    <button onclick="startTimer()">开始计时</button>
    <button onclick="stopTimer()">停止计时</button>
    <button onclick="resetTimer()">重置计时器</button>
</body>
</html>
